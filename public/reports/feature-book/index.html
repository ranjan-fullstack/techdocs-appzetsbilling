<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>AppZet Feature Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Noto+Sans+Oriya:wght@400;500;600;700&family=Baloo+Bhaina+2:wght@600;700;800&display=swap">
<style>
/* Layout: fixed left navigator (sections, search, status filter) and a right stage that shows one 4:5 feature card at a time.
   Tokens: page chrome follows the theme; the card keeps one fixed look because it is a marketing image.
   Type: Bricolage Grotesque for English names, Baloo Bhaina 2 for Odia headings, Noto Sans Oriya for Odia body. */
:root {
  --bg: #EEF1F8; --fg: #0F1B3D; --muted: #5B6478; --line: #D5DBEA; --panel: #FFFFFF; --hover: #E4E9F6; --sel: #0B2A6F; --sel-fg: #FFFFFF;
  --d-live: #1B8A3A; --d-prog: #D98A00; --d-soon: #7B86A3;
  --c-navy: #0B2A6F; --c-ink: #0F1B3D; --c-saffron: #F2A33A; --c-paper: #F7F9FE;
  --c-problem-bg: #FDECEA; --c-problem: #B3261E; --c-solve-bg: #E6F4EA; --c-solve: #17692F;
  --c-prog-bg: #FFF1D6; --c-prog: #8A5200; --c-soon-bg: #E7EAF3; --c-soon: #3C4764;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0E1426; --fg: #E8ECF8; --muted: #9AA5C2; --line: #26304D; --panel: #151D36; --hover: #1C2646; --sel: #F2A33A; --sel-fg: #0F1B3D; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0E1426; --fg: #E8ECF8; --muted: #9AA5C2; --line: #26304D; --panel: #151D36; --hover: #1C2646; --sel: #F2A33A; --sel-fg: #0F1B3D; color-scheme: dark }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Noto Sans Oriya", system-ui, sans-serif; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }
.app { display: grid; grid-template-columns: 310px minmax(0, 1fr); gap: 20px; max-width: 1400px; margin: 0 auto; align-items: start; }

/* navigator */
.nav { position: sticky; top: 12px; max-height: calc(100vh - 28px); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.nav-head { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.title { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 17px; margin: 0; }
.title b { color: var(--d-prog); }
.sub { font-size: 12px; color: var(--muted); margin: 0; }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 99px; padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--sel-fg); border-color: var(--sel); }
.nav-body { overflow-y: auto; padding: 6px 6px 10px; }
details { margin: 0; }
summary { cursor: pointer; padding: 8px 10px; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; border-radius: 8px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary:hover { background: var(--hover); }
summary span { color: var(--muted); font-weight: 600; }
.item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; padding: 6px 10px 6px 14px; border-radius: 8px; cursor: pointer; }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--sel); color: var(--sel-fg); }
.item .n { color: var(--muted); font-size: 11px; width: 22px; flex: none; font-variant-numeric: tabular-nums; }
.item[aria-current="true"] .n { color: inherit; opacity: .75; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.l { background: var(--d-live); } .dot.p { background: var(--d-prog); } .dot.s { background: var(--d-soon); }
.item .nm { min-width: 0; overflow-wrap: anywhere; }
.none { padding: 14px; font-size: 13px; color: var(--muted); }
.mobile-bar { display: none; }

/* stage */
.stage { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 0; }
.stage-top { width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.crumb { font-size: 12px; color: var(--muted); }
.pager { display: flex; gap: 6px; }
.pager button { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.pager button:disabled { opacity: .4; cursor: default; }
button:focus-visible, .item:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--d-prog); outline-offset: 2px; }

#card { width: 100%; max-width: min(1000px, max(560px, calc((100vh - 170px) * 1.6))); }
/* the card: landscape; left = name, picture, plan; middle = problem, solution, example; right = benefits, steps, who */
.card { container-type: inline-size; --f: 1.62cqw; --fl: 1.9cqw; --fh: 3.5cqw; --fo: 2.4cqw; --pad: 2.4cqw; width: 100%; aspect-ratio: 16 / 10; background: var(--c-paper); color: var(--c-ink); border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(11,42,111,.2); }
.top { border-radius: 16px 16px 0 0; background: var(--c-navy); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 1.2cqw var(--pad); }
.brand { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 2.2cqw; }
.brand b { color: var(--c-saffron); font-weight: 800; }
.pill { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 1.3cqw; letter-spacing: .08em; text-transform: uppercase; padding: .5cqw 1.4cqw; border-radius: 99px; box-shadow: 0 0 0 .3cqw rgba(255,255,255,.25); }
.pill.l { background: var(--c-solve-bg); color: var(--c-solve); } .pill.p { background: var(--c-prog-bg); color: var(--c-prog); } .pill.s { background: var(--c-soon-bg); color: var(--c-soon); }
.main { flex: 1; display: grid; grid-template-columns: 25% minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "l m r"; gap: 1.8cqw; padding: 1.8cqw var(--pad) 2cqw; }
.left { grid-area: l; display: flex; flex-direction: column; gap: 1.2cqw; min-width: 0; }
.mid { grid-area: m; display: flex; flex-direction: column; gap: 1.1cqw; min-width: 0; }
.right { grid-area: r; display: flex; flex-direction: column; gap: 1.3cqw; min-width: 0; }
.left h2 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: var(--fh); line-height: 1.06; margin: 0; letter-spacing: -.01em; text-wrap: balance; overflow-wrap: anywhere; }
.left .or { font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-weight: 700; font-size: var(--fo); color: var(--c-navy); margin: .5cqw 0 0; line-height: 1.25; }
.art { width: 100%; max-height: 17cqw; height: auto; display: block; margin: .6cqw 0; }
.meta { font-size: calc(var(--f) * .82); color: #4A5575; line-height: 1.4; }
.meta b { display: block; font-family: "Bricolage Grotesque", sans-serif; font-size: calc(var(--f) * .72); letter-spacing: .08em; text-transform: uppercase; color: #7B86A3; margin-bottom: .3cqw; }
.need { background: #E9EEFB; color: var(--c-navy); border-radius: .9cqw; padding: .6cqw 1cqw; font-weight: 600; }
.pk { display: flex; flex-wrap: wrap; gap: .5cqw; }
.pk i { font-style: normal; font-family: "Noto Sans Oriya", sans-serif; font-size: calc(var(--f) * .82); border-radius: 99px; padding: .3cqw 1cqw; background: #ECEFF7; color: #8A93AD; font-weight: 600; }
.pk i.on { background: var(--c-saffron); color: var(--c-ink); }
.band { padding: 1.1cqw 1.5cqw; border-radius: 1.4cqw; }
.band.problem { background: var(--c-problem-bg); } .band.solve { background: var(--c-solve-bg); } .band.eg { background: #FFF6E5; border: .2cqw dashed var(--c-saffron); }
.band .lab { font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-weight: 800; font-size: var(--fl); margin: 0 0 .2cqw; line-height: 1.2; }
.band.problem .lab { color: var(--c-problem); } .band.solve .lab { color: var(--c-solve); } .band.eg .lab { color: #8A5200; }
.band p { margin: 0; font-size: var(--f); line-height: 1.55; font-weight: 500; }
.blk { background: #fff; border: .2cqw solid #D9E0F1; border-radius: 1.4cqw; padding: 1.1cqw 1.4cqw; }
.blk .lab { font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-weight: 800; font-size: var(--fl); margin: 0 0 .5cqw; color: var(--c-navy); line-height: 1.2; }
.ben { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5cqw; }
.ben li { display: flex; gap: .8cqw; align-items: flex-start; font-size: var(--f); line-height: 1.45; font-weight: 500; }
.ben li::before { content: "✓"; flex: none; width: 1.9cqw; height: 1.9cqw; border-radius: 50%; background: var(--c-solve); color: #fff; font-size: calc(var(--f) * .85); display: grid; place-items: center; margin-top: .1cqw; font-family: system-ui, sans-serif; }
.stp { display: flex; flex-direction: column; gap: .6cqw; }
.stp div { display: flex; gap: .9cqw; align-items: center; font-size: var(--f); line-height: 1.4; font-weight: 500; }
.stp i { font-style: normal; flex: none; width: 2.3cqw; height: 2.3cqw; border-radius: 50%; background: var(--c-navy); color: #fff; display: grid; place-items: center; font-family: "Baloo Bhaina 2", sans-serif; font-weight: 800; font-size: calc(var(--f) * .95); }
.who { font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-weight: 800; font-size: var(--fl); color: var(--c-navy); margin: 0 0 .5cqw; line-height: 1.2; }
.tags { display: flex; flex-wrap: wrap; gap: .6cqw; }
.tags span { background: #fff; border: .2cqw solid var(--c-saffron); border-radius: 99px; padding: .3cqw 1.2cqw; font-size: calc(var(--f) * .95); font-weight: 600; }
.legend { width: 100%; max-width: 1000px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 14px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
@container (max-width: 860px) {
  .card { --f: 1.85cqw; --fl: 2.1cqw; --fh: 4cqw; --fo: 2.7cqw; aspect-ratio: auto; }
  .main { grid-template-columns: 31% minmax(0, 1fr); grid-template-areas: "l m" "l r"; }
}
@container (max-width: 640px) {
  .card { --f: 3.7cqw; --fl: 4.3cqw; --fh: 8cqw; --fo: 5.2cqw; --pad: 5cqw; }
  .top { padding: 3cqw var(--pad); } .brand { font-size: 4.6cqw; } .pill { font-size: 2.8cqw; padding: 1cqw 2.8cqw; }
  .main { grid-template-columns: 1fr; grid-template-areas: "l" "m" "r"; gap: 3cqw; padding: 4cqw var(--pad); }
  .left { display: grid; grid-template-columns: 1fr 32cqw; align-items: center; column-gap: 3cqw; }
  .left .meta { grid-column: 1 / -1; } .art { max-height: none; margin: 0; }
  .band { padding: 2.6cqw 3.4cqw; border-radius: 3cqw; } .blk { padding: 2.6cqw 3.4cqw; border-radius: 3cqw; }
  .ben li::before { width: 5cqw; height: 5cqw; } .stp i { width: 5.6cqw; height: 5.6cqw; }
  .ben, .stp { gap: 1.6cqw; } .tags { gap: 1.6cqw; } .tags span { padding: .8cqw 2.6cqw; }
  .meta { font-size: 3cqw; } .pk i { font-size: 3cqw; padding: .6cqw 2.2cqw; }
}


#detail { width: 100%; max-width: min(1000px, max(560px, calc((100vh - 170px) * 1.6))); }
.ds { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 26px; font-family: "Noto Sans Oriya", system-ui, sans-serif; }
.ds h3 { margin: 0 0 8px; font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-size: 17px; color: var(--fg); }
.ds p { margin: 0; font-size: 15px; line-height: 1.7; color: var(--fg); }
.ds ol, .ds ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7; }
.ds .qa { margin: 0 0 10px; font-size: 15px; line-height: 1.6; }
.ds .qa b { display: block; }
.ds .qa span { color: var(--muted); }
.ds .full { grid-column: 1 / -1; }
.ds .warn { background: rgba(217,138,0,.12); border: 1px solid var(--d-prog); border-radius: 10px; padding: 10px 14px; font-size: 14px; line-height: 1.6; }
.ds .tit { grid-column: 1 / -1; font-family: "Bricolage Grotesque", sans-serif; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.ds .soon { grid-column: 1 / -1; color: var(--muted); font-size: 14px; }
@media (max-width: 700px) { .ds { grid-template-columns: minmax(0, 1fr); } }

.modes { display: flex; gap: 6px; }
.mode { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.mode[aria-pressed="true"] { background: var(--sel); color: var(--sel-fg); border-color: var(--sel); }
#kit { width: 100%; max-width: 1000px; }
.kit { font-family: "Noto Sans Oriya", system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; }
.kit-head { background: var(--c-navy); color: #fff; border-radius: 14px; padding: 18px 22px; }
.eyebrow { margin: 0 0 6px; font-family: "Bricolage Grotesque", sans-serif; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--c-saffron); }
.kit-head h2 { margin: 0; font-family: "Bricolage Grotesque", sans-serif; font-size: 30px; line-height: 1.1; }
.kit-head .or { margin: 6px 0 0; font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-size: 22px; font-weight: 700; color: #fff; }
.kit-head .who { margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #D6DEF5; }
.kit-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
.k-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.k-sec.full { grid-column: 1 / -1; }
.k-sec h3 { margin: 0 0 10px; font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-size: 18px; }
.k-sec ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7; }
.k-sec p { margin: 0; font-size: 15px; line-height: 1.7; }
.pkgbox { background: #FFF6E5; border-color: var(--c-saffron); color: #0F1B3D; }
.pkgbox h3 { color: #8A5200; }
.pn { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 16px; }
.pp { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 30px; line-height: 1.2; }
.pp span { font-size: 14px; font-weight: 600; opacity: .7; }
.pm, .pl { font-size: 13.5px; opacity: .85; }
.goto { display: flex; flex-wrap: wrap; gap: 8px; }
.go { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 99px; padding: 6px 14px 6px 10px; font: inherit; font-size: 13.5px; cursor: pointer; }
.go:hover { background: var(--hover); }
.go b { font-family: "Bricolage Grotesque", sans-serif; font-size: 12px; color: var(--muted); }
.tl { display: flex; flex-direction: column; gap: 8px; }
.tlr { display: grid; grid-template-columns: 78px minmax(0, 190px) minmax(0, 1fr); gap: 4px 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 15px; line-height: 1.6; }
.tlr:last-child { border-bottom: 0; }
.tlr .tm { font-family: "Bricolage Grotesque", sans-serif; font-size: 12.5px; font-weight: 700; color: var(--d-prog); }
.tlr em { font-style: normal; color: var(--muted); }
.qa { margin: 0 0 10px !important; } .qa b { display: block; } .qa span { color: var(--muted); }
.warn2 { background: rgba(217,138,0,.10); border-color: var(--d-prog); }
.next { border-color: var(--d-live); }
.pk-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.pkg { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.pkg .po { margin: 0; font-family: "Baloo Bhaina 2", "Noto Sans Oriya", sans-serif; font-size: 17px; color: var(--muted); }
.pkg .pp { margin-top: 8px; color: var(--fg); } .pkg .pg { margin: 8px 0; font-size: 14.5px; line-height: 1.6; } .pkg .pw { font-size: 14px; color: var(--muted); }
.tbl { display: flex; flex-direction: column; }
.tr { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 4px 14px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.55; }
.tr:last-child { border-bottom: 0; } .tr em { font-style: normal; color: var(--muted); } .tr a { color: var(--fg); }
.mnote { margin: 10px 0 0 !important; font-size: 13px !important; color: var(--muted); }
@media (max-width: 700px) { .kit-grid, .pk-grid { grid-template-columns: minmax(0, 1fr); } .tlr { grid-template-columns: minmax(0, 1fr); } .tr { grid-template-columns: minmax(0, 1fr); } .kit-head h2 { font-size: 24px; } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .nav { position: static; max-height: none; }
  .nav-body { display: none; max-height: 52vh; }
  .nav.open .nav-body { display: block; }
  .mobile-bar { display: block; }
  .mobile-bar button { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
}

.mbar { display: none; }
.scrim { display: none; }
@media (max-width: 820px) {
  .mbar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin: 0 0 12px; }
  .mbar button { flex: none; border: 0; background: var(--sel); color: var(--sel-fg); border-radius: 8px; padding: 9px 14px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  #mtitle { min-width: 0; font-family: "Bricolage Grotesque", sans-serif; font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav { position: fixed; top: 0; left: 0; bottom: 0; width: min(88vw, 360px); max-height: none; border-radius: 0 16px 16px 0; z-index: 50; transform: translateX(-105%); transition: transform .22s ease; box-shadow: 0 0 40px rgba(0,0,0,.35); }
  .nav.open { transform: none; }
  .nav-body { display: block !important; flex: 1; max-height: none !important; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
  .nav-head { padding-top: max(14px, env(safe-area-inset-top, 0px)); }
  .mobile-bar { display: none !important; }
  body.navopen .scrim { display: block; position: fixed; inset: 0; background: rgba(8,14,32,.55); z-index: 40; }
  body.navopen { overflow: hidden; }
  .stage-top { position: static; }
}
</style>

<div class="mbar" id="mbar"><button type="button" id="menuBtn" aria-label="Open feature list">&#9776; Features</button><span id="mtitle"></span></div>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="nav" id="nav" aria-label="Features">
    <div class="nav-head">
      <h1 class="title">AppZet <b>Feature Book</b></h1>
      <p class="sub" id="count"></p>
      <div class="modes" id="modes"><button type="button" class="mode" data-m="cards" aria-pressed="true">Feature cards</button><button type="button" class="mode" data-m="kits" aria-pressed="false">Sell kits &amp; prices</button></div>
      <div class="mobile-bar"><button type="button" id="toggle">Browse features</button></div>
      <input class="search" id="q" type="search" placeholder="Search a feature" aria-label="Search a feature">
      <div class="chips" id="chips"></div>
    </div>
    <div class="nav-body" id="list"></div>
  </aside>

  <main class="stage">

function detailHtml(f) {
  var m = window.MORE && window.MORE[f.en];
  if (!m) { return '<div class="ds"><p class="soon">Detail sheet for this feature will be added: a longer explanation, a demo path, customer questions and limits.</p></div>'; }
  return '<div class="ds"><p class="tit">Detail sheet · ' + esc(f.en) + '</p>' +
    '<div class="full"><h3>ବିସ୍ତୃତ ବ୍ୟାଖ୍ୟା</h3><p>' + esc(m[0]) + '</p></div>' +
    '<div><h3>ଡେମୋ କେମିତି ଦେଖାଇବେ</h3><ol>' + m[1].map(function (d) { return '<li>' + esc(d) + '</li>'; }).join("") + '</ol></div>' +
    '<div><h3>ଗ୍ରାହକ ପଚାରିଲେ</h3>' + m[2].map(function (q) { return '<p class="qa"><b>' + esc(q[0]) + '</b><span>' + esc(q[1]) + '</span></p>'; }).join("") + '</div>' +
    (m[3] ? '<div class="full warn"><b>ଧ୍ୟାନରେ ରଖନ୍ତୁ: </b>' + esc(m[3]) + '</div>' : '') + '</div>';
}
function show(i, push) {
  cur = Math.max(0, Math.min(flat.length - 1, i));
  var f = flat[cur];
  $("card").innerHTML = cardHtml(f);
  if ($("mtitle")) { $("mtitle").textContent = f.en; }
  $("detail").innerHTML = detailHtml(f);
  $("crumb").textContent = f.secName + "  ·  " + (cur + 1) + " of " + flat.length;
  $("prev").disabled = cur === 0; $("next").disabled = cur === flat.length - 1;
  Array.prototype.forEach.call(document.querySelectorAll(".item"), function (b) { b.setAttribute("aria-current", b.dataset.i == cur ? "true" : "false"); });
  if (push !== false) { try { history.replaceState(null, "", "#f" + cur); } catch (e) {} }
}

function renderList() {
  var q = query.trim().toLowerCase(), html = "";
  SECTIONS.forEach(function (sec, si) {
    var rows = flat.filter(function (f) { return f.sec === si && (filter === "all" || f.st === filter) && (!q || f.en.toLowerCase().indexOf(q) >= 0); });
    if (!rows.length) return;
    html += '<details' + (q || filter !== "all" || (flat[cur] && si === flat[cur].sec) ? " open" : "") + '><summary>' + esc(sec[0]) + '<span>' + rows.length + '</span></summary>' +
      rows.map(function (f) { return '<button type="button" class="item" data-i="' + f.i + '" aria-current="' + (f.i === cur) + '"><span class="n">' + (f.i + 1) + '</span><i class="dot ' + f.st + '"></i><span class="nm">' + esc(f.en) + '</span></button>'; }).join("") + '</details>';
  });
  $("list").innerHTML = html || '<div class="none">No feature matches.</div>';
  var c = function (s) { return flat.filter(function (f) { return f.st === s; }).length; };
  $("count").textContent = flat.length + " features · " + c("l") + " live · " + c("p") + " in progress · " + c("s") + " coming soon";
}

$("chips").innerHTML = [["all", "All"], ["l", "Live"], ["p", "In progress"], ["s", "Coming soon"]].map(function (c) { return '<button type="button" class="chip" data-f="' + c[0] + '" aria-pressed="' + (c[0] === "all") + '">' + c[1] + '</button>'; }).join("");
$("chips").addEventListener("click", function (e) { var b = e.target.closest(".chip"); if (!b) return; filter = b.dataset.f; Array.prototype.forEach.call(document.querySelectorAll(".chip"), function (x) { x.setAttribute("aria-pressed", x === b); }); renderList(); });
$("q").addEventListener("input", function () { query = this.value; renderList(); });
$("list").addEventListener("click", function (e) { var b = e.target.closest(".item"); if (!b) return; show(+b.dataset.i); if (matchMedia("(max-width: 820px)").matches) { $("nav").classList.remove("open"); document.body.classList.remove("navopen"); window.scrollTo(0, 0); } });
$("prev").addEventListener("click", function () { show(cur - 1); renderList(); });
$("next").addEventListener("click", function () { show(cur + 1); renderList(); });
$("toggle").addEventListener("click", function () { $("nav").classList.toggle("open"); });
document.addEventListener("keydown", function (e) { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") { show(cur + 1); renderList(); } if (e.key === "ArrowLeft") { show(cur - 1); renderList(); } });
window.addEventListener("hashchange", function () { var m = /^#f(\d+)$/.exec(location.hash); if (m) { show(+m[1], false); renderList(); } });

var m0 = /^#f(\d+)$/.exec(location.hash);
show(m0 ? +m0[1] : 0, false); renderList();


// phone drawer: open from the top bar, close on the dim area or after choosing
function setNav(open) { $("nav").classList.toggle("open", open); document.body.classList.toggle("navopen", open); }
$("menuBtn").addEventListener("click", function () { setNav(!$("nav").classList.contains("open")); });
$("scrim").addEventListener("click", function () { setNav(false); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { setNav(false); } });

// ---- Sell kits and prices (second tab) ----
var mode = "cards", cardCur = 0, kitCur = 0;
var _show = show, _renderList = renderList;
var KITLIST = [{ id: "price", en: "Packages and prices", or: "ପ୍ୟାକେଜ୍ ଓ ମୂଲ୍ୟ" }].concat(window.KITS || []);
function pkgOf(k) { return (window.PKGS || []).filter(function (p) { return p.k === k; })[0]; }
function idxOf(name) { for (var i = 0; i < flat.length; i++) { if (flat[i].en === name) return i; } return -1; }
function money(s) { return /^[0-9]/.test(String(s)) ? "₹" + s : String(s); }
function priceBlock(p) { return p.year ? '<p class="pp">' + money(p.year) + '<span> / year</span></p><p class="pm">or ' + money(p.month) + ' / month</p>' : '<p class="pp">Price not set yet</p><p class="pm">Inactive draft: the owner sets the price</p>'; }

function pricingHtml() {
  var P = window.PKGS || [];
  return '<div class="kit"><div class="kit-head"><p class="eyebrow">Package · live in admin as an inactive draft</p><h2>Cafe package</h2><p class="or">କାଫେ ପ୍ୟାକେଜ୍</p><p class="who">One package, the one that exists in the live admin (plan id 7). Price and limits are not final.</p></div>' +
    '<div class="pk-grid">' + P.map(function (p) {
      return '<div class="pkg"><p class="pn">' + esc(p.en) + '</p><p class="po">' + esc(p.or) + '</p>' + priceBlock(p) + '<p class="pl">' + esc(p.limits) + '</p><p class="pg">' + esc(p.gives) + '</p><p class="pw"><b>Who:</b> ' + esc(p.who) + '</p></div>';
    }).join("") + '</div>' +
    ((window.ADDONS || []).length ? '<div class="k-sec full"><h3>Add-ons</h3><div class="tbl">' + (window.ADDONS || []).map(function (a) { return '<div class="tr"><b>' + esc(a[0]) + '</b><span>' + esc(a[1]) + '</span><em>' + esc(a[2]) + '</em></div>'; }).join("") + '</div></div>' : '') +
    '<div class="k-sec full warn2"><h3>Notes</h3><ul>' + (((window.PRICE_NOTES || {}).points) || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join("") + '</ul></div></div>';
}

function kitHtml(k) {
  var p = pkgOf(k.pkg);
  return '<div class="kit"><div class="kit-head"><p class="eyebrow">Sell kit · ' + esc(p.en) + ' package</p><h2>' + esc(k.en) + '</h2><p class="or">' + esc(k.or) + '</p><p class="who">' + esc(k.who) + '</p></div>' +
    '<div class="kit-grid">' +
    '<section class="k-sec pkgbox"><h3>Package and price</h3><p class="pn">' + esc(p.en) + ' · ' + esc(p.or) + '</p>' + priceBlock(p) + '<p class="pl">' + esc(p.limits) + '</p></section>' +
    '<section class="k-sec"><h3>ଦୋକାନର ସମସ୍ୟା</h3><ul>' + k.problems.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></section>' +
    '<section class="k-sec full"><h3>ଦେଖାଇବାକୁ କାର୍ଡ୍ (କ୍ରମରେ)</h3><div class="goto">' + k.cards.map(function (c, i) {
      var ix = idxOf(c); var st = ix >= 0 ? flat[ix].st : "s";
      return '<button type="button" class="go" data-goto="' + esc(c) + '"><i class="dot ' + st + '"></i><b>' + (i + 1) + '</b>' + esc(c) + '</button>';
    }).join("") + '</div></section>' +
    '<section class="k-sec full"><h3>୧୦ ମିନିଟ୍ ଡେମୋ</h3><div class="tl">' + k.demo.map(function (d) { return '<div class="tlr"><span class="tm">' + esc(d[0]) + ' min</span><b>' + esc(d[1]) + '</b><em>' + esc(d[2]) + '</em></div>'; }).join("") + '</div></section>' +
    '<section class="k-sec"><h3>ଗ୍ରାହକ ପଚାରିଲେ</h3>' + k.qa.map(function (q) { return '<p class="qa"><b>' + esc(q[0]) + '</b><span>' + esc(q[1]) + '</span></p>'; }).join("") + '</section>' +
    '<section class="k-sec warn2"><h3>ପ୍ରତିଶ୍ରୁତି ଦିଅନ୍ତୁ ନାହିଁ</h3><ul>' + k.notpromise.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></section>' +
    '<section class="k-sec full next"><h3>ପରବର୍ତ୍ତୀ ପଦକ୍ଷେପ</h3><p>' + esc(k.next) + '</p></section>' +
    '</div></div>';
}

function setMode(m) {
  mode = m;
  var kits = m === "kits";
  $("kit").hidden = !kits;
  ["card", "detail"].forEach(function (id) { $(id).hidden = kits; });
  document.querySelector(".stage-top").style.display = "flex";
  document.querySelector(".legend").hidden = kits;
  $("chips").hidden = kits;
  Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) { b.setAttribute("aria-pressed", b.dataset.m === m); });
}

function showKit(i, push) {
  kitCur = Math.max(0, Math.min(KITLIST.length - 1, i)); cur = kitCur;
  var k = KITLIST[kitCur];
  $("kit").innerHTML = k.id === "price" ? pricingHtml() : kitHtml(k);
  if ($("mtitle")) { $("mtitle").textContent = k.en; }
  $("crumb").textContent = "Sell kits and prices  ·  " + (kitCur + 1) + " of " + KITLIST.length;
  $("prev").disabled = kitCur === 0; $("next").disabled = kitCur === KITLIST.length - 1;
  if (push !== false) { try { history.replaceState(null, "", "#k" + kitCur); } catch (e) {} }
}

renderList = function () {
  if (mode === "cards") { return _renderList(); }
  var q = query.trim().toLowerCase();
  var rows = KITLIST.map(function (k, i) { return { k: k, i: i }; }).filter(function (r) { return !q || r.k.en.toLowerCase().indexOf(q) >= 0; });
  $("list").innerHTML = rows.map(function (r) { return '<button type="button" class="item" data-i="' + r.i + '" aria-current="' + (r.i === kitCur) + '"><span class="n">' + (r.i === 0 ? "₹" : r.i) + '</span><span class="nm">' + esc(r.k.en) + '</span></button>'; }).join("") || '<div class="none">No kit matches.</div>';
  $("count").textContent = "1 sell kit (Cafe) · 1 package · price not set yet";
};

show = function (i, push) {
  if (mode === "cards") { cardCur = Math.max(0, Math.min(flat.length - 1, i)); return _show(i, push); }
  showKit(i, push); renderList();
};

Array.prototype.forEach.call(document.querySelectorAll(".mode"), function (b) {
  b.addEventListener("click", function () {
    var m = b.dataset.m; if (m === mode) return;
    setMode(m); cur = m === "cards" ? cardCur : kitCur;
    if (m === "cards") { _show(cardCur, true); } else { showKit(kitCur, true); }
    renderList();
  });
});

$("kit").addEventListener("click", function (e) {
  var b = e.target.closest(".go"); if (!b) return;
  var ix = idxOf(b.dataset.goto); if (ix < 0) return;
  setMode("cards"); cardCur = ix; cur = ix; _show(ix, true); renderList(); window.scrollTo(0, 0); setNav(false);
});

(function () {
  var mk = /^#k(\d+)$/.exec(location.hash);
  if (mk) { setMode("kits"); kitCur = +mk[1]; cur = kitCur; showKit(kitCur, false); renderList(); }
})();

</script>


</body></html>
