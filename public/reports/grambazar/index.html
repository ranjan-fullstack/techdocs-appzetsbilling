B.splash=()=>`<div class="center" style="background:var(--deep);color:var(--on-deep)"><div class="logo" style="width:84px;height:84px;border-radius:26px;background:var(--saffron)">${LOGO('#2A1D00',54)}</div><h1 style="font-size:38px">GramBazar</h1><p>${S.lang==='or'?'ଆପଣଙ୍କ ଗାଁର ବଜାର':'Buy and sell with villages near you'}</p><button class="btn sf" data-a="go" data-r="b" data-s="onboard" style="max-width:220px">Get started</button><span class="sim">Prototype · sample data</span></div>`;
const LOGO=(c,s)=>`<svg viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true"><path d="M8 34h32M12 34V22l12-8 12 8v12M20 34v-8h8v8" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="12" r="4" fill="${c}"/></svg>`;
B.onboard=()=>{const sl=[['Find produce in nearby villages','Search by village, block or district. See who is selling paddy, vegetables, bikes and more.','🌾'],['Bulk buying and fair offers','Ask for a quotation or send an offer. Sellers reply with their price.','🤝'],['Buy for your family back home','Living in Chennai? Choose items and arrange pickup or delivery for family in Odisha.','🏡']];const i=S.b.slide,x=sl[i];
  return `<div class="center"><div style="font-size:84px" aria-hidden="true">${x[2]}</div><h2 style="font-size:24px">${x[0]}</h2><p class="meta" style="font-size:14px">${x[1]}</p><div class="dots">${sl.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div></div><div class="pad"><button class="btn" data-a="onb">${i<2?'Next':'Continue'}</button><div class="row" style="justify-content:space-between"><button class="chip" data-a="lang">${S.lang==='or'?'English':'ଓଡ଼ିଆ'}</button><button class="chip" data-a="go" data-r="b" data-s="login">Skip</button></div></div>`;};
B.login=()=>`${ptop('b','Log in')}<div class="pad">${fld('ph','Mobile number',{im:'numeric',max:10,ph:'10-digit number',err:S.b.err})}<div class="note"><span class="sim">Simulated</span> No real SMS is sent. Use code <b>123456</b>. Do not enter a real number.</div><button class="btn" data-a="sendotp">Send OTP</button></div>`;
B.otp=()=>`${ptop('b','Enter OTP')}<div class="pad"><p>We sent a code to ${esc(fv('ph','your number'))}.</p>${fld('otp','6-digit code',{im:'numeric',max:6,err:S.b.err})}<button class="btn" data-a="verifyotp">Verify</button><button class="btn sec" data-a="resendotp">Resend code</button></div>`;
B.role=()=>`${ptop('b','How will you use GramBazar?')}<div class="pad">${[['buy','🛒','I want to buy','Browse and order from villages near me.'],['family','🏡','Buying for family in Odisha','I live elsewhere (for example Chennai). I will choose pickup or delivery for family.'],['sell','📈','I want to sell','Farmers, shopkeepers and small businesses.']].map(x=>`<button class="card cp" data-a="role" data-v="${x[0]}" style="text-align:left;grid-template-columns:44px 1fr;align-items:center;display:grid;gap:10px"><span style="font-size:30px">${x[1]}</span><span><b>${x[2]}</b><br><span class="meta">${x[3]}</span></span></button>`).join('')}</div>`;
B.home=()=>{const a=liveProds().filter(p=>inScope(p,S.scope)).slice(0,8);const bulk=liveProds().filter(p=>p.bulk).slice(0,4);
  return `<div class="ptop"><button class="chip" data-a="go" data-r="b" data-s="loc" style="flex:1;text-align:left;min-width:0">📍 ${esc(S.loc.village)}, ${esc(S.loc.district)} ▾</button><button class="ib" data-a="lang" aria-label="Language">${S.lang==='or'?'EN':'ଓ'}</button><button class="ib" data-a="sheet" data-r="b" data-sh="notes" aria-label="Notifications">🔔${S.notes.b.length?`<span class="badge">${S.notes.b.length}</span>`:''}</button><button class="ib" data-a="go" data-r="b" data-s="cart" aria-label="Cart">🛒${S.cart.length?`<span class="badge">${S.cart.length}</span>`:''}</button></div>
  <div class="pad"><button class="search" data-a="go" data-r="b" data-s="search">🔍 ${t('search')}</button>
  ${S.outside?`<div class="note">🏡 Browsing from outside Odisha. Items are for family in <b>${esc(S.loc.district)}</b>. Delivery rules depend on each seller.</div>`:''}
  <div class="hero-b"><b style="font-family:var(--font-display);font-size:18px">${t('bulk')}</b><span style="font-size:13px">Buy more, pay less. Ask for a quotation on paddy, groundnut and more.</span><button class="btn s" data-a="bopen" data-id="p2" style="width:fit-content">See groundnuts</button></div>
  <div class="catg">${catList().filter(c=>S.catsOn[c.id]!==false).slice(0,10).map(c=>`<button class="cat" data-a="catgo" data-id="${c.id}"><i>${c.ic}</i>${esc(cname(c))}</button>`).join('')}</div>
  <div class="spread"><h3>${t('nearby')}</h3><button class="chip" data-a="go" data-r="b" data-s="search">See all</button></div>
  <div class="chips">${[['village','My village'],['block','My block'],['district','My district'],['all','All Odisha']].map(x=>`<button class="chip" aria-pressed="${S.scope===x[0]}" data-a="scope" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  ${a.length?`<div class="grid2">${a.map(pcard).join('')}</div>`:`<div class="note">No listings in this area yet. Try a wider area.</div>`}
  <h3>${t('bulk')}</h3><div class="grid2">${bulk.map(pcard).join('')}</div>
  <div class="row"><label class="row" style="font-size:13px"><input type="checkbox" id="lite" ${S.lite?'checked':''}> Low-data mode (hide images)</label></div></div>`;};
B.loc=()=>{const L=S.f;const d=fv('ld',S.loc.district),b=fv('lb',S.loc.block),v=fv('lv',S.loc.village);const bl=Object.keys(LOC[d]||{});const bb=bl.includes(b)?b:bl[0];const vl=(LOC[d]||{})[bb]||[];const vv=vl.includes(v)?v:vl[0];
  return `${ptop('b','Choose location')}<div class="pad">${fld('ld','District',{sel:Object.keys(LOC),def:d})}${fld('lb','Block',{sel:bl,def:bb})}${fld('lv','Village',{sel:vl,def:vv})}<label class="row"><input type="checkbox" id="outside" ${S.outside?'checked':''}> I live outside Odisha (for example Chennai) and I am buying for family here</label><div class="note">Village-to-village discovery: pick any village to see its sellers, even if you are far away.</div><button class="btn" data-a="applyloc">Show listings here</button></div>`;};
B.cats=()=>`${ptop('b',t('cats'))}<div class="pad">${catList().filter(c=>S.catsOn[c.id]!==false).map(c=>`<button class="card cp" data-a="catgo" data-id="${c.id}" style="grid-template-columns:44px 1fr auto;display:grid;align-items:center;text-align:left"><span style="font-size:28px">${c.ic}</span><b>${esc(cname(c))}</b><span class="meta">${liveProds().filter(p=>p.cat===c.id).length} items</span></button>`).join('')}</div>`;
B.search=()=>{const f=S.f;const r=results();const open=S.b.filters;
  return `<div class="ptop"><button class="ib" data-a="back" data-r="b" aria-label="Back">←</button><input id="sq" value="${esc(f.sq||'')}" placeholder="${esc(t('search'))}" aria-label="Search" data-live="1"><button class="ib" data-a="toggleFilters" aria-label="Filters">☰</button></div>
  <div class="pad"><div class="chips">${[['village','My village'],['block','My block'],['district','My district'],['all','All Odisha']].map(x=>`<button class="chip" aria-pressed="${(f.sscope||'all')===x[0]}" data-a="sscope" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
  ${open?`<div class="card cp">${fld('sc','Category',{sel:[['','All categories']].concat(catList().map(c=>[c.id,c.en])),def:f.sc||''})}<div class="grid2">${fld('pmin','Min price ₹',{im:'numeric',live:1,def:f.pmin||''})}${fld('pmax','Max price ₹',{im:'numeric',live:1,def:f.pmax||''})}</div>${fld('sqty','Quantity I need',{im:'numeric',live:1,def:f.sqty||'',ph:'e.g. 10'})}${fld('ssort','Sort',{sel:[['new','Newest'],['low','Price: low to high'],['near','Nearest village']],def:f.ssort||'new'})}<label class="row"><input type="checkbox" id="sver" ${f.sver?'checked':''}> Verified sellers only</label><label class="row"><input type="checkbox" id="sstock" ${f.sstock!==false?'checked':''}> In stock only</label></div>`:''}
  <span class="msg">${r.length} result${r.length===1?'':'s'}. Sample sellers, not real or verified businesses.</span>
  ${r.length?`<div class="grid2">${r.map(pcard).join('')}</div>`:`<div class="center"><div style="font-size:44px">🔍</div><b>No matching listings</b><span class="meta">Try a wider area, lower quantity, or remove filters.</span><button class="btn sec s" data-a="clearf">Clear filters</button></div>`}</div>`;};
B.detail=()=>{const p=prod(S.b.a);if(!p)return B.home();const s=sell(p.sid);const q=+fv('dq',p.moq);const it={pid:p.id,qty:q};const up=unitPrice(it);const sc=scopeOf(p);
  return `${ptop('b',esc(pname(p)),`<button class="ib" data-a="wish" data-id="${p.id}" aria-label="Wishlist">${wish(p.id)?'♥':'♡'}</button><button class="ib" data-a="go" data-r="b" data-s="cart" aria-label="Cart">🛒${S.cart.length?`<span class="badge">${S.cart.length}</span>`:''}</button>`)}${artBox(p,true)}<div class="pad">
  <div><h2 style="font-size:21px">${esc(pname(p))}</h2><div class="row" style="margin-top:6px"><span class="price" style="font-size:22px">${inr(p.price)}</span><span class="meta">per ${p.unit} · seller's asking price</span></div></div>
  <div class="chips"><span class="pill i">${p.stock} ${p.unit} available</span><span class="pill">Min order ${p.moq} ${p.unit}</span><span class="pill">${SCN[sc]}</span>${p.pickup?'<span class="pill">Pickup</span>':''}${p.delivery?'<span class="pill">Delivery in '+p.dd.join(', ')+'</span>':'<span class="pill w">No delivery</span>'}</div>
  ${p.bulk?`<div class="note">📦 Bulk price: buy ${p.bulk.min}+ ${p.unit} and save ${p.bulk.off}% (${inr(Math.round(p.price*(100-p.bulk.off)/100))} per ${p.unit}).</div>`:''}
  <p>${esc(p.desc)}</p>
  <button class="card cp" data-a="go" data-r="b" data-s="seller" data-arg="${s.id}" style="text-align:left"><div class="spread"><b>${esc(s.biz)}</b>${vBadge(s)}</div><span class="meta">${esc(s.village)}, ${esc(s.block)}, ${esc(s.district)} · ${s.n?stars(s.rating)+' '+s.rating+' ('+s.n+' sample ratings)':'No ratings yet'}</span></button>
  <div class="card cp"><div class="spread"><b>Quantity</b><div class="step"><button data-a="dq" data-d="-1" aria-label="Less">−</button><b>${q}</b><button data-a="dq" data-d="1" aria-label="More">+</button></div></div><div class="spread"><span class="meta">${q} × ${inr(up)} ${up<p.price?'(bulk price)':''}</span><b class="price">${inr(q*up)}</b></div>${q<p.moq?`<span class="msg e">Minimum order is ${p.moq} ${p.unit}.</span>`:''}${q>p.stock?`<span class="msg e">Only ${p.stock} ${p.unit} available.</span>`:''}</div>
  <button class="btn sf" data-a="addcart" data-id="${p.id}" ${p.stock<1||q<p.moq||q>p.stock?'disabled':''}>${t('add')}</button>
  <div class="grid2"><button class="btn sec" data-a="sheet" data-r="b" data-sh="quote">Request quotation</button><button class="btn sec" data-a="sheet" data-r="b" data-sh="offer">Make an offer</button></div>
  <button class="btn sec" data-a="go" data-r="b" data-s="chat" data-arg="${s.id}">💬 Chat with seller</button>
  <div class="note"><b>Cancellation and refunds:</b> cancel free before the seller accepts. After that, refunds depend on the seller and platform review within ${S.set.refundDays} days. <span class="sim">Prototype policy</span></div></div>`;};
B.seller=()=>{const s=sell(S.b.a);const ps=liveProds().filter(p=>p.sid===s.id);
  return `${ptop('b','Seller profile')}<div class="pad"><div class="card cp"><div class="spread"><b style="font-size:18px">${esc(s.biz)}</b>${vBadge(s)}</div><span class="meta">${esc(s.type)} · ${esc(s.village)}, ${esc(s.district)} · Joined ${s.joined}</span><span>${s.n?stars(s.rating)+' '+s.rating+' ('+s.n+' sample ratings)':'No ratings yet'}</span><span class="msg">Sample seller. Not a real or verified business.</span></div><button class="btn" data-a="go" data-r="b" data-s="chat" data-arg="${s.id}">💬 Chat</button><h3>Ratings and reviews</h3>${s.n?REV.map(r=>`<div class="card cp"><b>${r[0]}</b> ${stars(r[1])}<span class="meta">${r[2]}</span></div>`).join(''):'<div class="note">No reviews yet.</div>'}<h3>Listings (${ps.length})</h3><div class="grid2">${ps.map(pcard).join('')}</div></div>`;};
B.wish=()=>{const a=S.wish.map(prod).filter(Boolean);return `${ptop('b',t('wish'))}<div class="pad">${a.length?`<div class="grid2">${a.map(pcard).join('')}</div>`:'<div class="center"><div style="font-size:44px">♡</div><b>Nothing saved yet</b><span class="meta">Tap the heart on any product.</span></div>'}</div>`;};
function cartTotals(){const g={};S.cart.forEach(it=>{const p=prod(it.pid);if(p)(g[p.sid]=g[p.sid]||[]).push(it);});return g;}
B.cart=()=>{const g=cartTotals();let tot=0;const rows=Object.keys(g).map(sid=>`<div class="card cp"><b>${esc(sell(sid).biz)}</b>${g[sid].map(it=>{const p=prod(it.pid);const up=unitPrice(it);tot+=up*it.qty;const bad=it.qty<p.moq||it.qty>p.stock;return `<div class="rowx"><div style="width:64px;flex:none">${artBox(p)}</div><div class="grow"><b style="font-size:13.5px">${esc(pname(p))}</b><div class="meta">${inr(up)} / ${p.unit}${it.price?' (agreed price)':up<p.price?' (bulk price)':''}</div><div class="spread" style="margin-top:4px"><div class="step"><button data-a="cartq" data-id="${p.id}" data-d="-1" aria-label="Less">−</button><b>${it.qty}</b><button data-a="cartq" data-id="${p.id}" data-d="1" aria-label="More">+</button></div><button class="chip" data-a="cartdel" data-id="${p.id}">Remove</button></div>${bad?`<span class="msg e">${it.qty<p.moq?'Minimum '+p.moq+' '+p.unit:'Only '+p.stock+' available'}</span>`:''}</div></div>`;}).join('')}</div>`).join('');
  const bad=S.cart.some(it=>{const p=prod(it.pid);return it.qty<p.moq||it.qty>p.stock;});
  return `${ptop('b',t('cart'))}<div class="pad">${S.cart.length?rows+`<div class="card cp"><div class="spread"><b>Subtotal</b><b class="price">${inr(tot)}</b></div><span class="meta">Delivery fee, if any, is added at checkout.</span></div><button class="btn sf" data-a="go" data-r="b" data-s="checkout" ${bad?'disabled':''}>${t('checkout')}</button>`:'<div class="center"><div style="font-size:44px">🛒</div><b>Your cart is empty</b><span class="meta">Add paddy, vegetables or other items.</span><button class="btn s" data-a="tab" data-r="b" data-s="home">Browse</button></div>'}</div>`;};
function fulfil(){const g=cartTotals();const rd=S.co.family?fv('rd',S.loc.district):S.loc.district;const out={};Object.keys(g).forEach(sid=>{const ps=g[sid].map(i=>prod(i.pid));out[sid]={pickup:ps.every(p=>p.pickup),delivery:ps.every(p=>p.delivery&&p.dd.includes(rd))};});return out;}
function coTotals(){const g=cartTotals();const ff=fulfil();let sub=0,del=0;Object.keys(g).forEach(sid=>{g[sid].forEach(it=>sub+=unitPrice(it)*it.qty);if(S.co.mode==='delivery')del+=80;});return {sub,del,tot:sub+del,ok:Object.keys(g).every(sid=>ff[sid][S.co.mode])};}
B.checkout=()=>{const T=coTotals();const ff=fulfil();const d=fv('rd',S.loc.district),b=fv('rb',S.loc.block),v=fv('rv',S.loc.village);const bl=Object.keys(LOC[d]||{});const bb=bl.includes(b)?b:bl[0];const vl=(LOC[d]||{})[bb]||[];const vv=vl.includes(v)?v:vl[0];
  return `${ptop('b',t('checkout'))}<div class="pad"><div class="card cp"><b>Pickup or delivery</b><div class="grid2"><button class="chip" aria-pressed="${S.co.mode==='pickup'}" data-a="mode" data-v="pickup">🚶 Pickup</button><button class="chip" aria-pressed="${S.co.mode==='delivery'}" data-a="mode" data-v="delivery">🚚 Delivery (+${inr(80)} per seller)</button></div>${T.ok?'':`<span class="msg e">${S.co.mode==='delivery'?'A seller in your cart does not deliver to this area. Choose pickup by a family member, or remove that item.':'A seller does not offer pickup.'}</span>`}</div>
  <div class="card cp"><label class="row"><input type="checkbox" id="family" ${S.co.family?'checked':''}> <b>Buying for family in Odisha</b></label>${S.co.family?`<span class="meta">Your family member collects the order or receives the delivery.</span>${fld('rname','Family member name',{ph:'Sample name',def:fv('rname','Sample Family Member')})}${fld('rphone','Their phone (sample only)',{im:'numeric',ph:'Do not enter a real number',def:fv('rphone','')})}${fld('rd','District',{sel:Object.keys(LOC),def:d})}${fld('rb','Block',{sel:bl,def:bb})}${fld('rv','Village',{sel:vl,def:vv})}`:`<span class="meta">Delivery area: ${esc(S.loc.village)}, ${esc(S.loc.district)}</span>`}${fld('landmark','Landmark or pickup note',{ph:'e.g. near the temple',def:fv('landmark','')})}</div>
  <div class="card cp"><div class="spread"><span>Items</span><b>${inr(T.sub)}</b></div><div class="spread"><span>Delivery</span><b>${inr(T.del)}</b></div><div class="spread"><b>Total</b><b class="price">${inr(T.tot)}</b></div></div>
  <div class="note"><b>Cancellation:</b> free before the seller accepts. <b>Refunds:</b> reviewed within ${S.set.refundDays} days. <span class="sim">Prototype policy</span></div>
  <button class="btn sf" data-a="go" data-r="b" data-s="pay" ${T.ok?'':'disabled'}>Continue to payment</button></div>`;};
B.pay=()=>{const T=coTotals();
  return `${ptop('b','Payment')}<div class="pad"><div class="note"><span class="sim">Simulated payment</span> No real money moves and no card or UPI details are collected.</div>${[['upi','UPI (simulated)','📲'],['card','Card (simulated)','💳'],['cod','Pay at pickup or delivery','💵']].map(x=>`<button class="card cp" data-a="method" data-v="${x[0]}" role="radio" aria-checked="${S.co.method===x[0]}" style="text-align:left;grid-template-columns:34px 1fr 24px;display:grid;align-items:center;${S.co.method===x[0]?'border-color:var(--deep);background:var(--chip)':''}"><span style="font-size:24px">${x[2]}</span><b>${x[1]}</b><span>${S.co.method===x[0]?'●':'○'}</span></button>`).join('')}<div class="spread"><b>Pay</b><b class="price">${inr(T.tot)}</b></div>${S.b.paying?'<div class="skel"></div><span class="msg">Processing simulated payment…</span>':''}<button class="btn sf" data-a="pay" ${S.b.paying?'disabled':''}>Pay ${inr(T.tot)} (simulated)</button></div>`;};
B.success=()=>`<div class="center"><div class="logo" style="width:80px;height:80px;border-radius:50%;background:var(--ok)"><svg viewBox="0 0 48 48" width="44" height="44"><path d="M12 25l8 8 16-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>Order placed</h2><p class="meta">Order ${esc((S.b.a||[]).join(', '))}. The seller will accept or reject it. Payment is simulated.</p><button class="btn" data-a="openorder" data-id="${(S.b.a||[])[0]}">View order</button><button class="btn sec" data-a="tab" data-r="b" data-s="home">Continue shopping</button></div>`;
B.orders=()=>{const tb=fv('otab','active');const mine=S.orders.filter(o=>o.bid==='b1');const a=mine.filter(o=>['completed','rejected','cancelled'].includes(o.status)===(tb==='past'));
  return `${ptop('b','My orders')}<div class="pad"><div class="chips">${[['active','Active'],['past','Past']].map(x=>`<button class="chip" aria-pressed="${tb===x[0]}" data-a="otab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>${a.length?a.slice().reverse().map(o=>`<button class="card cp" data-a="openorder" data-id="${o.id}" style="text-align:left"><div class="spread"><b>${o.id} · ${esc(sell(o.sid).biz)}</b><span class="pill ${o.status==='completed'?'ok':['rejected','cancelled'].includes(o.status)?'b':'w'}">${SL[o.status]}</span></div><span class="meta">${o.items.map(i=>i.qty+' '+i.unit+' '+i.name).join(', ')}</span><b class="price">${inr(o.total)}</b></button>`).join(''):'<div class="center"><div style="font-size:44px">📦</div><b>No orders here</b><span class="meta">Orders you place appear here.</span></div>'}</div>`;};
B.order=()=>{const o=ord(S.b.a);if(!o)return B.orders();const can=['placed','accepted'].includes(o.status);
  return `${ptop('b','Order '+o.id)}<div class="pad"><div class="card cp"><div class="spread"><b>${esc(sell(o.sid).biz)}</b><span class="pill w">${SL[o.status]}</span></div>${o.items.map(i=>`<div class="spread"><span>${esc(i.name)} × ${i.qty} ${i.unit}</span><b>${inr(i.qty*i.price)}</b></div>`).join('')}<div class="spread"><b>Total</b><b class="price">${inr(o.total)}</b></div><span class="meta">${o.mode==='delivery'?'Delivery':'Pickup'}${o.family?' for '+esc(o.family.name)+', '+esc(o.family.village):''} · Payment: ${esc(o.pay.method)} (${o.pay.state})</span></div><h3>Status</h3><div class="card cp">${timeline(o)}</div>
  <div class="grid2"><button class="btn sec" data-a="go" data-r="b" data-s="chat" data-arg="${o.sid}">Chat</button><button class="btn sec" data-a="go" data-r="b" data-s="support">Help</button></div>${can?`<button class="btn bad" data-a="cancelorder" data-id="${o.id}">Cancel order</button>`:''}<div class="note">${can?'You can cancel now. A refund request is sent for review.':'Cancellation is closed for this order. Raise a complaint if there is a problem.'}</div></div>`;};
B.chat=()=>{const s=sell(S.b.a);const m=S.chats[s.id]||(S.chats[s.id]=[]);

const NAV=[['ovw','Overview'],['buyers','Buyers'],['sellers','Sellers'],['verify','Seller verification'],['moder','Listing moderation'],['cats','Categories'],['orders','Orders & fulfilment'],['pays','Payments'],['refunds','Refunds'],['comm','Commission'],['disp','Disputes & complaints'],['locs','Locations'],['rev','Revenue analytics'],['promo','Promotions'],['sett','Platform settings'],['audit','Audit logs']];
AD.ovw=()=>{const st={};S.orders.forEach(o=>st[o.status]=(st[o.status]||0)+1);const stData=Object.keys(st).map(k=>[SL[k].split(' ')[0],st[k]]);const mo=monthly();
  return `<div class="kpis"><div class="kpi"><span>Gross merchandise value (GMV)</span><b>${inr(gmv())}</b><span>Total value of goods ordered</span></div><div class="kpi"><span>Platform revenue (commission)</span><b>${inr(commRev())}</b><span>On completed orders only</span></div><div class="kpi"><span>Orders</span><b>${S.orders.length}</b><span>${S.orders.filter(o=>o.status==='placed').length} awaiting seller</span></div><div class="kpi"><span>Needs attention</span><b>${pendingCount()}</b><span>Sellers, products, complaints, refunds</span></div></div>
  <div class="charts"><div class="chart"><b>GMV by month (₹)</b>${bars(mo.map(m=>[m[0].slice(0,3),m[1]]),{money:1,label:'GMV by month'})}<span class="meta">Jun–Sep are illustrative sample figures; October updates live.</span></div><div class="chart"><b>Orders by status</b>${bars(stData,{label:'Orders by status'})}</div></div>
  <div class="charts"><div class="card cp"><b>Work queue</b>${[['verify','Sellers awaiting verification',S.sellers.filter(s=>s.ver==='pending').length],['moder','Products awaiting moderation',S.products.filter(p=>p.status==='pending').length],['disp','Open complaints',S.complaints.filter(c=>c.status==='open').length],['refunds','Pending refunds',S.refunds.filter(r=>r.status==='pending').length]].map(x=>`<button class="spread card cp" data-a="apage" data-p="${x[0]}" style="text-align:left"><span>${x[1]}</span><b>${x[2]}</b></button>`).join('')}</div><div class="card cp"><b>Recent activity</b>${S.audit.slice(0,6).map(a=>`<div class="meta">${a.t} · ${esc(a.who)} · ${esc(a.act)}</div>`).join('')}</div></div>`;};
AD.buyers=()=>table('buyers',[{h:'Buyer',v:b=>esc(b.name)},{h:'Type',v:b=>b.type},{h:'City',v:b=>esc(b.city)},{h:'Orders',v:b=>S.orders.filter(o=>o.bid===b.id).length},{h:'Status',v:b=>stPill(b.status)}],S.buyers,{type:'buyer',filter:{label:'All statuses',opts:['active','suspended'],fn:(x,v)=>x.status===v}});
AD.sellers=()=>table('sellers',[{h:'Seller',v:s=>esc(s.biz)},{h:'Type',v:s=>s.type},{h:'Location',v:s=>esc(s.village+', '+s.district)},{h:'Verification',v:s=>stPill(s.ver)},{h:'Account',v:s=>stPill(s.susp?'suspended':'active')},{h:'Rating',v:s=>s.n?s.rating:'—'}],S.sellers,{type:'seller',filter:{label:'All verification',opts:['verified','pending','unverified','rejected'],fn:(x,v)=>x.ver===v}});
AD.verify=()=>`<div class="note">Review applications and approve or reject. Documents are samples only; no real documents are stored.</div>`+table('verify',[{h:'Applicant',v:s=>esc(s.biz)},{h:'Type',v:s=>s.type},{h:'Location',v:s=>esc(s.village+', '+s.district)},{h:'Documents',v:s=>s.docs.length},{h:'Status',v:s=>stPill(s.ver)}],S.sellers.filter(s=>['pending','rejected'].includes(s.ver)),{type:'seller'});
AD.moder=()=>table('moder',[{h:'Product',v:p=>esc(p.name)},{h:'Seller',v:p=>esc(sell(p.sid).biz)},{h:'Category',v:p=>esc(cat(p.cat).en)},{h:'Price',v:p=>inr(p.price)+' / '+p.unit},{h:'Status',v:p=>stPill(p.status)}],S.products,{type:'prod',deff:'pending',filter:{label:'All statuses',opts:['pending','live','paused','rejected','removed'],fn:(x,v)=>x.status===v}});
AD.cats=()=>`<div class="tools"><input id="newcat" placeholder="New category name" aria-label="New category"><button class="btn s" data-a="addcat">Add category</button></div><div class="tw"><table><thead><tr><th>Category</th><th>Listings</th><th>Commission</th><th>Visible to buyers</th></tr></thead><tbody>${catList().map(c=>`<tr><td>${c.ic} ${esc(c.en)}</td><td>${S.products.filter(p=>p.cat===c.id).length}</td><td>${S.set.catComm[c.id]!=null?S.set.catComm[c.id]+'%':'Default '+S.set.commission+'%'}</td><td><label class="row"><input type="checkbox" data-a="togcat" data-id="${c.id}" ${S.catsOn[c.id]!==false?'checked':''} aria-label="Show ${esc(c.en)}"> ${S.catsOn[c.id]!==false?'Shown':'Hidden'}</label></td></tr>`).join('')}</tbody></table></div>`;
AD.orders=()=>table('orders',[{h:'Order',v:o=>o.id},{h:'Buyer',v:o=>esc(o.buyer)},{h:'Seller',v:o=>esc(sell(o.sid).biz)},{h:'Items',v:o=>esc(o.items.map(i=>i.qty+' '+i.unit+' '+i.name).join(', ')).slice(0,48)},{h:'Total',v:o=>inr(o.total)},{h:'Mode',v:o=>o.mode},{h:'Status',v:o=>stPill(o.status)}],S.orders.slice().reverse(),{type:'order',filter:{label:'All statuses',opts:Object.keys(SL),fn:(x,v)=>x.status===v}});
AD.pays=()=>`<div class="note"><span class="sim">Simulated</span> These are demo transaction records. No real payments are processed.</div>`+table('pays',[{h:'Reference',v:o=>o.pay.ref},{h:'Order',v:o=>o.id},{h:'Method',v:o=>o.pay.method},{h:'Amount',v:o=>inr(o.total)},{h:'Platform fee',v:o=>inr(o.fee)},{h:'State',v:o=>esc(o.pay.state)}],S.orders);
AD.refunds=()=>table('refunds',[{h:'Refund',v:r=>r.id},{h:'Order',v:r=>r.oid},{h:'Amount',v:r=>inr(r.amt)},{h:'Reason',v:r=>esc(r.reason)},{h:'Status',v:r=>stPill(r.status)}],S.refunds,{type:'refund',filter:{label:'All statuses',opts:['pending','approved','rejected'],fn:(x,v)=>x.status===v}});
AD.comm=()=>{const ex=3500*S.set.commission/100;return `<div class="card cp"><b>Default commission per completed order</b><div class="row"><input type="range" id="cr" min="0" max="10" step="0.5" value="${S.set.commission}" aria-label="Default commission percent"><b id="crv" style="min-width:52px">${S.set.commission}%</b></div><span class="meta">Illustrative range 3–5%. On a ₹3,500 order the platform earns ${inr(ex)} and the seller receives ${inr(3500-ex)}. GMV is what buyers spend; platform revenue is only the commission.</span></div><div class="card cp"><b>Category overrides</b><span class="meta">Leave empty to use the default.</span><div class="grid2">${catList().map(c=>`<label class="f">${esc(c.en)} (%)<input id="cc-${c.id}" inputmode="decimal" value="${S.set.catComm[c.id]!=null?S.set.catComm[c.id]:''}" placeholder="${S.set.commission}"></label>`).join('')}</div><button class="btn s" data-a="savecomm">Save overrides</button></div><span class="msg">Changes apply to new orders only. Existing orders keep their recorded commission.</span>`;};
AD.disp=()=>table('disp',[{h:'Case',v:c=>c.id},{h:'Order',v:c=>c.oid||'—'},{h:'By',v:c=>esc(c.by)},{h:'Issue',v:c=>c.kind},{h:'Status',v:c=>stPill(c.status)}],S.complaints,{type:'comp',deff:'',filter:{label:'All statuses',opts:['open','resolved','dismissed'],fn:(x,v)=>x.status===v}});
AD.locs=()=>`<div class="tools"><select id="lad" aria-label="District">${Object.keys(LOC).map(d=>`<option ${fv('lad','Ganjam')===d?'selected':''}>${d}</option>`).join('')}</select><select id="lab" aria-label="Block">${Object.keys(LOC[fv('lad','Ganjam')]||{}).map(b=>`<option ${fv('lab','')===b?'selected':''}>${b}</option>`).join('')}</select><input id="lav" placeholder="New village name" aria-label="New village"><button class="btn s" data-a="addvillage">Add village</button></div><div class="charts">${Object.keys(LOC).map(d=>`<div class="card cp"><b>${d}</b>${Object.keys(LOC[d]).map(b=>`<div><span class="pill i">${b}</span> <span class="meta">${LOC[d][b].join(', ')}</span></div>`).join('')}</div>`).join('')}</div>`;
AD.rev=()=>{const mo=monthly();const byc={};S.orders.filter(o=>o.status==='completed').forEach(o=>o.items.forEach(i=>{const c=cat(prod(i.pid)?prod(i.pid).cat:'other').en;byc[c]=(byc[c]||0)+i.qty*i.price*rateFor(prod(i.pid)||{cat:''})/100;}));
  return `<div class="kpis"><div class="kpi"><span>GMV (ordered)</span><b>${inr(gmv())}</b></div><div class="kpi"><span>Commission revenue</span><b>${inr(commRev())}</b></div><div class="kpi"><span>Promoted-listing revenue</span><b>${inr(promoRev())}</b></div><div class="kpi"><span>Effective take rate</span><b>${gmv()?((commRev()/gmv())*100).toFixed(1):0}%</b></div></div><div class="charts"><div class="chart"><b>Platform revenue by month (₹)</b>${bars(mo.map(m=>[m[0].slice(0,3),m[2]]),{money:1,label:'Revenue by month'})}<span class="meta">Illustrative sample months plus live October.</span></div><div class="chart"><b>Commission by category (₹, live)</b>${Object.keys(byc).length?bars(Object.keys(byc).map(k=>[k.split(' ')[0],byc[k]]),{money:1,label:'Commission by category'}):'<div class="note">No completed orders yet.</div>'}</div></div><span class="msg">GMV is not revenue. Revenue is commission, promotions and other platform income.</span>`;};
AD.promo=()=>`<div class="tools"><select id="ppid" aria-label="Product">${S.products.filter(p=>p.status==='live'&&!p.promo).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')||'<option value="">No eligible products</option>'}</select><select id="pwk" aria-label="Weeks"><option value="1">1 week</option><option value="2">2 weeks</option><option value="4">4 weeks</option></select><button class="btn s" data-a="addpromo">Promote (${inr(S.set.promoPrice)} / week)</button></div><div class="tw"><table><thead><tr><th>Product</th><th>Seller</th><th>Weeks</th><th>Paid</th><th></th></tr></thead><tbody>${S.promos.map(p=>`<tr><td>${esc(prod(p.pid).name)}</td><td>${esc(sell(prod(p.pid).sid).biz)}</td><td>${p.weeks}</td><td>${inr(p.paid)}</td><td><button class="btn bad s" data-a="endpromo" data-id="${p.pid}">End</button></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">No promoted listings.</td></tr>'}</tbody></table></div><span class="msg">Promoted listings are shown first and labelled &ldquo;Promoted&rdquo; to buyers.</span>`;
AD.sett=()=>`<div class="card cp"><b>Platform settings</b>${[['maint','Maintenance mode (shows a notice to users)'],['otpSim','OTP simulation (demo code 123456)'],['minGuard','Enforce seller minimum order quantities'],['odia','Odia language option (draft translations)'],['lowband','Low-data mode available to users']].map(x=>`<label class="row"><input type="checkbox" data-a="setting" data-k="${x[0]}" ${S.set[x[0]]?'checked':''}> ${x[1]}</label>`).join('')}${fld('setrd','Refund review window (days)',{im:'numeric',def:S.set.refundDays})}${fld('setpp','Promoted listing price per week ₹',{im:'numeric',def:S.set.promoPrice})}<button class="btn s" data-a="savesett">Save</button></div>`;
AD.audit=()=>table('audit',[{h:'When',v:a=>a.t},{h:'Actor',v:a=>esc(a.who)},{h:'Action',v:a=>esc(a.act)}],S.audit);
function drawer(){const d=S.a.drawer;if(!d)return '';let c='';
  if(d.type==='buyer'){const b=S.buyers.find(x=>x.id===d.id);c=`<h3>${esc(b.name)}</h3>${stPill(b.status)}<div class="meta">${b.type} · ${esc(b.city)}</div><div class="meta">${S.orders.filter(o=>o.bid===b.id).length} orders (sample data)</div><button class="btn ${b.status==='active'?'bad':''}" data-a="askbuyer" data-id="${b.id}">${b.status==='active'?'Suspend buyer':'Reactivate buyer'}</button>`;}
  if(d.type==='seller'){const s=sell(d.id);c=`<h3>${esc(s.biz)}</h3><div class="chips">${stPill(s.ver)}${stPill(s.susp?'suspended':'active')}</div><div class="meta">${esc(s.name)} · ${s.type}<br>${esc(s.village)}, ${esc(s.block)}, ${esc(s.district)}</div><div class="card cp"><b>Documents (samples)</b>${s.docs.length?s.docs.map(x=>`<span>✓ ${esc(x)}</span>`).join(''):'<span class="meta">No documents.</span>'}</div><div class="meta">Listings: ${S.products.filter(p=>p.sid===s.id).length} · Orders: ${S.orders.filter(o=>o.sid===s.id).length}</div>${['pending','rejected','unverified'].includes(s.ver)?`<button class="btn" data-a="askapprove" data-id="${s.id}">Approve seller</button>${s.ver!=='rejected'?`<button class="btn bad" data-a="askrejseller" data-id="${s.id}">Reject application</button>`:''}`:''}<button class="btn ${s.susp?'':'bad'}" data-a="asksusp" data-id="${s.id}">${s.susp?'Reinstate seller':'Suspend seller'}</button>`;}
  if(d.type==='prod'){const p=prod(d.id);c=`<h3>${esc(p.name)}</h3>${stPill(p.status)}<div style="max-width:260px">${artBox(p)}</div><div class="meta">${esc(sell(p.sid).biz)} · ${esc(cat(p.cat).en)}<br>${inr(p.price)} / ${p.unit} · ${p.stock} in stock · min ${p.moq}</div><p>${esc(p.desc)}</p><div class="note">Checklist: photo matches item, price is realistic, category is correct, item is permitted, no personal contact details in the text.</div>${p.status==='pending'?`<button class="btn" data-a="askmod" data-id="${p.id}" data-v="live">Approve listing</button>${fld('rej','Rejection reason',{sel:['Photo does not match','Prohibited item','Misleading price','Missing details']})}<button class="btn bad" data-a="askmod" data-id="${p.id}" data-v="rejected">Reject listing</button>`:p.status==='live'||p.status==='paused'?`<button class="btn bad" data-a="askmod" data-id="${p.id}" data-v="removed">Remove from marketplace</button>`:''}`;}
  if(d.type==='order'){const o=ord(d.id);c=`<h3>Order ${o.id}</h3>${stPill(o.status)}<div class="meta">${esc(o.buyer)} → ${esc(sell(o.sid).biz)}<br>${o.mode} · ${o.date}${o.family?'<br>For family: '+esc(o.family.name)+', '+esc(o.family.village):''}</div>${o.items.map(i=>`<div class="spread"><span>${esc(i.name)} × ${i.qty} ${i.unit}</span><b>${inr(i.qty*i.price)}</b></div>`).join('')}<div class="spread"><span>Commission</span><b>${inr(o.fee)}</b></div><div class="card cp">${timeline(o)}</div>${['placed','accepted','packed','ready','out'].includes(o.status)?`<button class="btn bad" data-a="askforce" data-id="${o.id}">Cancel and refund</button>`:''}`;}
  if(d.type==='refund'){const r=S.refunds.find(x=>x.id===d.id);c=`<h3>Refund ${r.id}</h3>${stPill(r.status)}<div class="meta">Order ${r.oid} · ${inr(r.amt)}<br>${esc(r.reason)}</div><div class="note"><span class="sim">Simulated</span> No money moves.</div>${r.status==='pending'?`<button class="btn" data-a="askref" data-id="${r.id}" data-v="approved">Approve refund</button><button class="btn bad" data-a="askref" data-id="${r.id}" data-v="rejected">Reject refund</button>`:''}`;}
  if(d.type==='comp'){const k=S.complaints.find(x=>x.id===d.id);c=`<h3>Case ${k.id}</h3>${stPill(k.status)}<div class="meta">${esc(k.by)} · ${k.kind}${k.oid?' · Order '+k.oid:''}</div><p>${esc(k.text)}</p>${k.note?`<div class="note">Resolution note: ${esc(k.note)}</div>`:''}${k.status==='open'?`${fld('cnote','Resolution note',{area:1,ph:'What was decided and why'})}<button class="btn" data-a="askcomp" data-id="${k.id}" data-v="resolved">Resolve</button>${k.oid&&ord(k.oid)&&ord(k.oid).status==='completed'?`<button class="btn sec" data-a="askcomp" data-id="${k.id}" data-v="refund">Resolve with partial refund (10%)</button>`:''}<button class="btn bad" data-a="askcomp" data-id="${k.id}" data-v="dismissed">Dismiss</button>`:''}`;}
  return `<aside class="drawer" aria-label="Details"><button class="btn sec s" data-a="closedrawer" style="width:fit-content">✕ Close</button>${c}</aside>`;}
function confirmModal(){const c=S.a.confirm;if(!c)return '';return `<div class="modalbg" role="dialog" aria-modal="true" aria-label="Confirm"><div class="modal"><h3>Please confirm</h3><p>${esc(c.msg)}</p><div class="grid2"><button class="btn sec" data-a="acancel">Cancel</button><button class="btn" data-a="aconfirm">Confirm</button></div></div></div>`;}
function renderAdmin(){const a=S.a;
  if(!a.auth)return `<div class="card cp" style="max-width:420px;margin:30px auto;padding:22px"><div class="row"><div class="logo">${LOGO('#fff',22)}</div><h2>GramBazar Admin</h2></div><span class="meta">Prototype sign-in. No real credentials are used.</span>${fld('ae','Staff email',{def:'admin@example.test'})}${fld('apw','Password',{type:'password',def:'demo-only'})}<button class="btn" data-a="alogin">Sign in (simulated)</button></div>`;
  const cur=NAV.find(n=>n[0]===a.page);
  return `<div class="admin"><nav class="side" aria-label="Admin"><h4>GramBazar Admin</h4>${NAV.map(n=>`<button data-a="apage" data-p="${n[0]}" ${a.page===n[0]?'aria-current="page"':''}>${n[1]}${n[0]==='verify'&&S.sellers.some(s=>s.ver==='pending')?' ●':''}</button>`).join('')}</nav><div class="amain"><div class="atop"><h2>${cur[1]}</h2><span class="pill w">${pendingCount()} need attention</span><span class="pill">admin@example.test</span><button class="sm" data-a="alogout">Sign out</button></div><div class="acont">${(AD[a.page]||AD.ovw)()}</div></div></div>${drawer()}${confirmModal()}`;}
const askc=(msg,fn)=>{S.a.confirm={msg,fn};};
Object.assign(A,{
 alogin:()=>{S.a.auth=true;S.a.page='ovw';logA('admin (demo)','Signed in');},alogout:()=>{S.a.auth=false;S.a.drawer=null;},
 apage:d=>{S.a.page=d.p;S.a.drawer=null;},adrawer:d=>{S.a.drawer={type:d.t,id:d.id};},closedrawer:()=>{S.a.drawer=null;},acancel:()=>{S.a.confirm=null;},aconfirm:()=>{const c=S.a.confirm;S.a.confirm=null;if(c)c.fn();},
 askbuyer:d=>{const b=S.buyers.find(x=>x.id===d.id);askc((b.status==='active'?'Suspend ':'Reactivate ')+b.name+'?',()=>{b.status=b.status==='active'?'suspended':'active';logA('admin (demo)',b.status+' buyer '+b.id);toast('Buyer '+b.status);});},
 askapprove:d=>{const s=sell(d.id);askc('Approve '+s.biz+' as a verified seller?',()=>{s.ver='verified';logA('admin (demo)','Approved seller '+s.id);note('s','Your seller account was verified');S.flags.approvedSeller=1;toast('Seller approved');});},
 askrejseller:d=>{const s=sell(d.id);askc('Reject the application from '+s.biz+'?',()=>{s.ver='rejected';logA('admin (demo)','Rejected seller '+s.id);toast('Application rejected');});},
 asksusp:d=>{const s=sell(d.id);askc((s.susp?'Reinstate ':'Suspend ')+s.biz+'? '+(s.susp?'':'Their listings will be hidden from buyers.'),()=>{s.susp=!s.susp;logA('admin (demo)',(s.susp?'Suspended ':'Reinstated ')+'seller '+s.id);toast(s.susp?'Seller suspended':'Seller reinstated');});},
 askmod:d=>{const p=prod(d.id);const why=d.v==='rejected'?fv('rej','Photo does not match'):'';askc(({live:'Approve',rejected:'Reject',removed:'Remove'})[d.v]+' listing "'+p.name+'"?'+(why?' Reason: '+why+'.':''),()=>{p.status=d.v;logA('admin (demo)',d.v+' product '+p.id+(why?' ('+why+')':''));note('s','Listing "'+p.name+'" is '+d.v+(why?': '+why:''));S.flags.moderated=1;toast('Listing '+d.v);});},
 askforce:d=>{const o=ord(d.id);askc('Cancel order '+o.id+' and refund '+inr(o.total)+' (simulated)?',()=>{o.status='cancelled';o.hist.push({s:'cancelled',t:nowT()});restock(o);S.refunds.push({id:nid('r'),oid:o.id,amt:o.total,reason:'Cancelled by admin',status:'approved'});logA('admin (demo)','Force-cancelled order '+o.id);note('b','Order '+o.id+' was cancelled by support. Refund issued (simulated).');toast('Order cancelled and refunded');});},
 askref:d=>{const r=S.refunds.find(x=>x.id===d.id);askc((d.v==='approved'?'Approve':'Reject')+' refund '+r.id+' for '+inr(r.amt)+'?',()=>{r.status=d.v;logA('admin (demo)',d.v+' refund '+r.id);note('b','Refund for '+r.oid+' '+d.v);toast('Refund '+d.v);});},
 askcomp:d=>{const k=S.complaints.find(x=>x.id===d.id);const note_=(fv('cnote','')||'').trim();askc((d.v==='dismissed'?'Dismiss':'Resolve')+' case '+k.id+'?',()=>{k.status=d.v==='dismissed'?'dismissed':'resolved';k.note=note_||(d.v==='dismissed'?'No action needed.':'Resolved by admin.');if(d.v==='refund'){const o=ord(k.oid);S.refunds.push({id:nid('r'),oid:o.id,amt:Math.round(o.total*.1),reason:'Partial refund: '+k.kind,status:'approved'});k.note+=' Partial refund of 10% issued (simulated).';}S.f.cnote='';logA('admin (demo)',k.status+' complaint '+k.id);note('b','Your complaint '+k.id+' was '+k.status);S.flags.resolvedComplaint=1;toast('Case '+k.status);});},
 addcat:()=>{const n=($('#newcat')||{}).value||'';if(n.trim().length<3)return toast('Enter a category name (3+ letters).');const id='x'+(S.extraCats.length+1);S.extraCats.push({id,en:n.trim(),or:'',ic:'📦'});S.catsOn[id]=true;logA('admin (demo)','Added category '+n.trim());toast('Category added');},
 togcat:d=>{S.catsOn[d.id]=S.catsOn[d.id]===false;logA('admin (demo)',(S.catsOn[d.id]?'Showed ':'Hid ')+'category '+d.id);},
 savecomm:()=>{catList().forEach(c=>{const v=($('#cc-'+c.id)||{}).value;if(v===''||v==null)delete S.set.catComm[c.id];else if(!isNaN(+v))S.set.catComm[c.id]=+v;});logA('admin (demo)','Saved category commission overrides');toast('Saved. Applies to new orders.');},
 addvillage:()=>{const d=fv('lad','Ganjam'),b=fv('lab',Object.keys(LOC[d])[0]),v=(($('#lav')||{}).value||'').trim();if(v.length<2)return toast('Enter a village name.');LOC[d][b].push(v);logA('admin (demo)','Added village '+v+' in '+b);toast('Village added');},
 addpromo:()=>{const id=fv('ppid',($('#ppid')||{}).value);if(!id)return toast('No eligible products.');const wk=+fv('pwk',1);const p=prod(id);p.promo=true;S.promos.push({pid:id,weeks:wk,paid:wk*S.set.promoPrice});logA('admin (demo)','Promoted '+id+' for '+wk+' week(s)');toast('Listing promoted');},
 endpromo:d=>{prod(d.id).promo=false;S.promos=S.promos.filter(p=>p.pid!==d.id);logA('admin (demo)','Ended promotion '+d.id);},
 setting:d=>{S.set[d.k]=!S.set[d.k];logA('admin (demo)','Setting '+d.k+' = '+S.set[d.k]);},
 savesett:()=>{S.set.refundDays=Math.max(0,+fv('setrd',S.set.refundDays)||0);S.set.promoPrice=Math.max(0,+fv('setpp',S.set.promoPrice)||0);logA('admin (demo)','Saved platform settings');toast('Settings saved');},
});
const LOC0=JSON.stringify(LOC);
/* ---------- business model ---------- */
const PRE={cons:{comm:3,sub:99,subPct:5,sellers:150,promoN:8,promoP:199,bizN:5,bizFee:299,orders:400,aov:2500,refund:8,pay:2,opex:120000},base:{comm:4,sub:199,subPct:10,sellers:300,promoN:25,promoP:299,bizN:15,bizFee:499,orders:1200,aov:3500,refund:5,pay:1.8,opex:150000},opt:{comm:5,sub:249,subPct:15,sellers:600,promoN:60,promoP:349,bizN:40,bizFee:699,orders:3500,aov:4200,refund:3,pay:1.6,opex:260000}};
const BF=[['comm','Commission per completed order (%)',0,10,.5],['orders','Orders per month',0,5000,50],['aov','Average order value (₹)',500,10000,100],['refund','Refunds and cancellations (% of orders)',0,25,.5],['pay','Payment fees (% of GMV)',0,4,.1],['sellers','Active sellers',0,1000,10],['subPct','Sellers on a subscription plan (%)',0,50,1],['sub','Subscription price (₹ / month)',0,999,10],['promoN','Promoted listings per month',0,200,1],['promoP','Promoted listing price (₹)',0,999,10],['bizN','Business and bulk-buyer accounts',0,200,1],['bizFee','Business account fee (₹ / month)',0,2999,50],['opex','Operating expenses (₹ / month)',0,600000,5000]];
function bizCalc(b){const gmv=b.orders*b.aov,comp=gmv*(1-b.refund/100),comm=comp*b.comm/100,subs=b.sellers*b.subPct/100*b.sub,promo=b.promoN*b.promoP,biz=b.bizN*b.bizFee,rev=comm+subs+promo+biz,fees=gmv*b.pay/100,net=rev-fees-b.opex;
  const contr=b.aov*(1-b.refund/100)*b.comm/100-b.aov*b.pay/100,fixed=b.opex-(subs+promo+biz);const be=contr>0?Math.max(0,Math.ceil(fixed/contr)):null;return {gmv,comp,comm,subs,promo,biz,rev,fees,net,be,take:gmv?rev/gmv*100:0};}
function bizRes(){const b=S.biz,r=bizCalc(b);const L=(k,v,big)=>`<div class="line ${big?'big':''}"><span>${k}</span><b>${v}</b></div>`;
  return L('Gross merchandise value (GMV)',inr(r.gmv))+L('GMV after refunds and cancellations',inr(r.comp))+L('Commission revenue',inr(r.comm))+L('Subscription revenue',inr(r.subs))+L('Promoted listings',inr(r.promo))+L('Business accounts',inr(r.biz))+L('Platform revenue',inr(r.rev),1)+L('Revenue as % of GMV',r.take.toFixed(1)+'%')+L('Payment fees',inr(r.fees))+L('Operating expenses',inr(b.opex))+`<div class="line big"><span>Net result per month</span><b style="color:${r.net>=0?'var(--ok)':'var(--danger)'}">${r.net<0?'−':''}${inr(Math.abs(r.net))}</b></div>`+L('Break-even orders per month',r.be==null?'Not reachable at these rates':r.be.toLocaleString('en-IN'));}
function renderBiz(){return `<div class="wrap"><div class="hero"><h1>Business model</h1><p>Adjust the assumptions to see how GMV differs from platform revenue. These are illustrative inputs, not forecasts or market data.</p></div><div class="chips" style="margin-bottom:12px"><button class="chip" data-a="preset" data-v="cons">Conservative</button><button class="chip" data-a="preset" data-v="base">Base</button><button class="chip" data-a="preset" data-v="opt">Optimistic</button></div><div class="biz"><div class="bl card cp">${BF.map(f=>`<label>${f[1]}<span><input type="range" id="bz-${f[0]}" min="${f[2]}" max="${f[3]}" step="${f[4]}" value="${S.biz[f[0]]}" aria-label="${f[1]}"><b id="bzv-${f[0]}" style="color:var(--ink)">${S.biz[f[0]]}</b></span></label>`).join('')}</div><div class="res card cp" id="bizres">${bizRes()}</div></div><div class="note" style="margin-top:12px">Commission of 3–5% is shown as an example only. GMV is money buyers spend with sellers. Platform revenue is only what GramBazar keeps. Refunds, payment fees and operating costs reduce the result.</div></div>`;}
function updateBiz(){const r=$('#bizres');if(r)r.innerHTML=bizRes();BF.forEach(f=>{const e=$('#bzv-'+f[0]);if(e)e.textContent=S.biz[f[0]];});}
/* ---------- demos ---------- */
function demoSteps(){const o1=S.orders.find(o=>o.bid==='b1'&&o.items.some(i=>i.pid==='p1'));const l1=S.orders.filter(o=>o.sid==='s1'&&o.bid==='b1').slice(-1)[0];const ix=o=>o?FLOWOF(o).indexOf(o.status):-1;const q=S.nego.find(n=>n.pid==='p2');
  return [{t:'Demo 1 · Buy paddy from a local seller',steps:[['Open Swarna paddy (Haridakhandi)',!!S.flags.viewedPaddy],['Add 5 or more quintals to the cart',S.cart.some(i=>i.pid==='p1')||!!o1],['Check out and pay (simulated)',!!o1],['Open the order and view its status',!!(S.flags.viewedOrder&&o1)]]},
   {t:'Demo 2 · Seller fulfils the order',steps:[['Open the new order in the Seller app',!!S.flags.sellerSawOrder],['Accept the order',ix(l1)>=1],['Move it to packed and ready or out for delivery',ix(l1)>=3],['Mark it completed',!!l1&&l1.status==='completed']]},
   {t:'Demo 3 · Bulk groundnut quotation',steps:[['Buyer taps Request quotation on groundnuts',!!q],['Seller enters a price in Offers',!!(q&&q.sprice)],['Buyer accepts the offer in Messages',!!(q&&q.status==='accepted')]]},
   {t:'Demo 4 · Admin approvals',steps:[['Approve the pending seller (Meera Jena)',sell('s4').ver==='verified'],['Approve or reject the pending cauliflower listing',prod('p16').status!=='pending'],['Resolve a sample complaint',S.complaints.some(c=>c.status!=='open')]]}];}
function demoPanel(){return demoSteps().map((d,i)=>`<div class="demo"><b>${d.t}</b><ol>${d.steps.map(s=>`<li class="${s[1]?'done':''}"><i>${s[1]?'✓':''}</i><span>${s[0]}</span></li>`).join('')}</ol><button class="btn sec s" data-a="demo" data-n="${i+1}">Start this demo</button></div>`).join('');}
function demoOrder(){if(S.orders.some(o=>o.bid==='b1'&&o.sid==='s1'&&o.status==='placed'))return;const p=prod('p1');const items=[{pid:'p1',name:p.name,qty:10,unit:p.unit,price:Math.round(p.price*.97)}];const sub=items[0].qty*items[0].price;const id=nid('o');p.stock-=10;
  S.orders.push({id,bid:'b1',buyer:'Demo Buyer (sample)',sid:'s1',items,sub,fee:sub*rateFor(p)/100,total:sub,mode:'pickup',status:'placed',addr:'Sample address',family:null,date:'Today',pay:{method:'upi',ref:'SIM-'+id,state:'paid (simulated)'},hist:[{s:'placed',t:nowT()}]});}
Object.assign(A,{
 demo:d=>{const n=+d.n;S.f.sq='';S.toast='';
  if(n===1){S.cart=[];S.flags.viewedPaddy=0;S.flags.viewedOrder=0;S.outside=true;S.view='buyer';S.b.stack=[];S.b.s='home';S.b.sheet=null;toast('Demo 1: open the paddy listing from Haridakhandi');}
  if(n===2){demoOrder();S.flags.sellerSawOrder=0;S.sl.me='s1';S.sl.stack=[];S.sl.s='orders';S.f.stab='new';S.view='seller';toast('Demo 2: open the new order');}
  if(n===3){S.nego=S.nego.filter(x=>x.pid!=='p2');S.view='buyer';S.b.stack=[];S.b.s='detail';S.b.a='p2';S.f.dq=2;S.f.nq=10;toast('Demo 3: tap Request quotation');}
  if(n===4){const s=sell('s4');s.ver='pending';const p=prod('p16');p.status='pending';if(!S.complaints.some(c=>c.status==='open'))S.complaints.push({id:nid('c'),oid:'o4',by:'Kavita Sahu (sample)',kind:'Quality problem',text:'Coconuts were smaller than listed (sample complaint).',status:'open',note:''});S.a.auth=true;S.a.page='verify';S.a.drawer=null;S.view='admin';toast('Demo 4: open Meera Jena to approve');}},
 view:d=>{S.view=d.v;S.a.drawer=null;},
 preset:d=>{S.biz=Object.assign({},PRE[d.v]);},
 theme:()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';},
 reset:()=>{Object.keys(LOC).forEach(k=>delete LOC[k]);Object.assign(LOC,JSON.parse(LOC0));S=seed();toast('Prototype reset');},
});
/* ---------- launcher & shell ---------- */
function renderLauncher(){const card=(v,bg,ic,h,p,cta)=>`<button class="lcard" data-a="view" data-v="${v}"><div class="lart" style="background:${bg};font-size:64px" aria-hidden="true">${ic}</div><div class="lbody"><h3>${h}</h3><p>${p}</p><span class="go">${cta} →</span></div></button>`;
  return `<div class="wrap"><div class="hero"><span class="pill i" style="width:fit-content">Interactive prototype · sample data · no real payments</span><h1>GramBazar</h1><p>A rural marketplace for Odisha. Browse produce from nearby villages, sell your harvest, and manage the platform. Three connected experiences share one demo state, so a buyer's order shows up for the seller and the admin.</p></div>
  <div class="cards3">${card('buyer','linear-gradient(135deg,#FFF3C4,#CDE9D6)','🛒','Buyer app','Village-to-village search, bulk buying, offers, checkout and order tracking. Works for family buying from Chennai.','Open buyer app')}${card('seller','linear-gradient(135deg,#CDE9D6,#FDE3A8)','🌾','Seller / farmer app','Register, list products with photos, manage stock, answer offers and fulfil orders.','Open seller app')}${card('admin','linear-gradient(135deg,#DCE7E1,#F6E2B5)','🖥','Admin dashboard','Verify sellers, moderate listings, handle orders, refunds, complaints and commission.','Open admin')}</div>
  <button class="lcard" data-a="view" data-v="biz" style="width:100%;margin-bottom:22px"><div class="lbody"><h3>📊 Business model calculator</h3><p>Commission, subscriptions, promoted listings, refunds, payment fees and costs. GMV is shown separately from platform revenue.</p><span class="go">Open calculator →</span></div></button>
  <h2 style="margin-bottom:10px">Guided demos</h2><div class="demos">${demoPanel()}</div>
  <div class="note" style="margin-top:18px"><b>What is simulated:</b> OTP (code 123456), payments, chat replies, notifications and seller verification. Sellers, buyers, prices and reviews are fictional samples. Product pictures are illustrations. Odia text is a draft for native-speaker review.</div></div>`;}
function shell(){const v=S.view;const T=[['launcher','Launcher'],['buyer','Buyer app'],['seller','Seller app'],['admin','Admin'],['biz','Business model']];
  return `<header class="bar"><button class="brand" data-a="view" data-v="launcher" aria-label="GramBazar launcher"><span class="logo">${LOGO('#fff',22)}</span>GramBazar</button><nav class="tabs" aria-label="Experiences">${T.map(x=>`<button class="tab" data-a="view" data-v="${x[0]}" ${v===x[0]?'aria-current="page"':''}>${x[1]}</button>`).join('')}</nav><button class="sm" data-a="reset">Reset</button><button class="sm" data-a="theme" aria-label="Toggle theme">Light / Dark</button></header>${S.set.maint?'<div class="note" style="margin-top:10px">Maintenance mode is on (sample notice shown to users).</div>':''}`;}
function draw(){const root=$('#app');const act=document.activeElement;const aid=act&&act.id;let ss=null;try{ss=act&&act.selectionStart;}catch(x){}const pb=$('.pbody');const key=S.view+(S.view==='buyer'?S.b.s:S.view==='seller'?S.sl.s:S.a.page);const sc=pb?pb.scrollTop:0;const ac=$('.acont');const dr=$('.drawer');const drs=dr?dr.scrollTop:0;
  let body='';if(S.view==='launcher')body=renderLauncher();else if(S.view==='buyer')body=`<div class="wrap"><div class="exp"><div class="rail"><h3>Buyer app</h3><p class="meta">Log in (OTP 123456), pick a role, then browse. Use the demos to try complete journeys.</p>${demoPanel()}</div>${renderBuyer()}</div></div>`;
  else if(S.view==='seller')body=`<div class="wrap"><div class="exp"><div class="rail"><h3>Seller app</h3><p class="meta">Use the demo seller, or register a new one and approve it in Admin.</p>${demoPanel()}</div>${renderSeller()}</div></div>`;
  else if(S.view==='admin')body=`<div class="wrap"><details class="card cp" style="margin-bottom:14px"><summary><b>Guided demos</b></summary><div class="demos" style="margin-top:10px">${demoPanel()}</div></details>${renderAdmin()}</div>`;
  else body=renderBiz();
  root.innerHTML=shell()+body+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  const pb2=$('.pbody');if(pb2&&draw.key===key)pb2.scrollTop=sc;else if(pb2)pb2.scrollTop=0;if(!pb2&&draw.key!==key)window.scrollTo(0,0);const d2=$('.drawer');if(d2)d2.scrollTop=drs;draw.key=key;
  if(aid){const e=document.getElementById(aid);if(e&&(e.tagName==='INPUT'||e.tagName==='TEXTAREA')&&e.type!=='range'&&e.type!=='file'&&e.type!=='checkbox'){e.focus();try{e.setSelectionRange(ss,ss);}catch(x){}}}}
function readFile(inp){const f=inp.files&&inp.files[0];if(!f)return;if(f.size>3e6){toast('Photo is too large for this demo (3 MB max).');draw();return;}const r=new FileReader();r.onload=()=>{(S.f.photos=S.f.photos||[]).push(r.result);draw();};r.readAsDataURL(f);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='INPUT'&&el.type==='checkbox'){}const f=A[el.dataset.a];if(f){f(el.dataset,el,e);draw();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-a]')){e.target.click();}});
document.addEventListener('input',e=>{const el=e.target,id=el.id;if(!id)return;
  if(id.startsWith('bz-')){S.biz[id.slice(3)]=+el.value;updateBiz();return;}
  if(id==='cr'){S.set.commission=+el.value;const v=$('#crv');if(v)v.textContent=el.value+'%';return;}
  if(id.startsWith('aq-')){S.a.q[id.slice(3)]=el.value;draw();return;}
  if(el.type==='checkbox'||el.type==='file')return;S.f[id]=el.value;if(el.dataset.live)draw();});
document.addEventListener('change',e=>{const el=e.target,id=el.id;if(!id)return;
  if(el.type==='file'){readFile(el);return;}
  if(el.type==='checkbox'){if(el.dataset.a)return;if(id==='lite')S.lite=el.checked;else if(id==='outside')S.outside=el.checked;else if(id==='family')S.co.family=el.checked;else if(id==='sver'||id==='sstock'||id==='ppick'||id==='pdel')S.f[id]=el.checked;else if(/^doc\d$/.test(id))S.f[id]=el.checked;else return;draw();return;}
  if(id.startsWith('af-')){S.a.f[id.slice(3)]=el.value;draw();return;}
  if(id==='cr')return;
  if(el.tagName==='SELECT'){S.f[id]=el.value;draw();return;}S.f[id]=el.value;});
draw();
})();</script>
